# RetroChat restricted SSH account. Keep the final Match all directive because
# macOS includes this fragment near the beginning of its main sshd_config.
Match User retrochat
    ForceCommand /usr/local/bin/retrochat-login
    DisableForwarding yes
    PermitTTY yes
    PermitUserRC no
    MaxSessions 1
    MaxAuthTries 3
    ClientAliveInterval 300
    ClientAliveCountMax 2

Match all
